name: Continuous Deployment (Teer.club Live)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Execute Automated Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          password: ${{ secrets.DO_PASSWORD }}
          # Alternatively, if you use SSH Keys (highly recommended):
          # key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 40m
          command_timeout: 40m
          script: |
            echo "==== 🚀 CD Pipeline Started ===="
            
            # Install git on the host if not present (safeguard)
            if ! command -v git &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y git
            fi
            
            # 1. Self-Healing Clone: Setup project if running on a fresh VM
            if [ ! -d "/var/www/teer.club/.git" ]; then
              echo "[CD] 🟢 Fresh Droplet detected! Provisioning server packages..."
              sudo mkdir -p /var/www
              sudo chown -R $USER:$USER /var/www
              rm -rf /var/www/teer.club
              
              # Clone securely using GitHub Actions temporary access token
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/myloveankyy/teer-club.git /var/www/teer.club
              
              cd /var/www/teer.club
              chmod +x setup-server.sh build-and-run.sh
              
              # Automatically configure database, Redis, Node, Firewalls, and Nginx Proxy
              sudo ./setup-server.sh
            else
              cd /var/www/teer.club
              git config --global --add safe.directory /var/www/teer.club
              git fetch --all
              git reset --hard origin/main
              chmod +x setup-server.sh build-and-run.sh
            fi
            
            # 2. Run TypeScript compiles, PM2 workers, and database syncs
            ./build-and-run.sh
            
            echo "==== 🎉 Deployment and VM Setup Finished Successfully! ===="
